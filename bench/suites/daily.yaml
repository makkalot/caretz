# Everyday tasks in four difficulty tiers. Run one tier with --tier.
# Verifiers grade only files in the workspace; question tasks ask the model to
# save its answer to answer.txt or answer.json. `make test-bench-daily` checks
# every verifier against its reference solution without a model.
name: daily
benchmark: local
timeout_seconds: 600
tasks:
  # daily-simple: one input, one step.
  - id: find-contact
    tier: daily-simple
    workspace: bench/workspaces/daily/find-contact
    prompt_file: bench/tasks/daily/find-contact.md
    evaluator_command: python3 -I "$BENCH_ROOT/verifiers/daily/find-contact/verify.py"
